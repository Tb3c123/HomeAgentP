# HomeAgentP CasaOS AppManagement Compose Specification
# Uses locally built images (homeagentp-core:local, homeagentp-web:local) without `build:`
# because CasaOS AppManagement copies Compose files to /var/lib/casaos/apps/homeagentp/
# and does not support relative build contexts.
name: homeagentp

services:
  homeagentp-core:
    image: homeagentp-core:local
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOMEAGENTP_ENV: ${HOMEAGENTP_ENV:-staging}
      HOMEAGENTP_DB_PATH: /data/homeagentp.db
      HOMEAGENTP_SECRET_KEY: ${HOMEAGENTP_SECRET_KEY:?Set a random secret in .env}
      HOMEAGENTP_ADMIN_USERNAME: ${HOMEAGENTP_ADMIN_USERNAME:-admin}
      HOMEAGENTP_ADMIN_PASSWORD: ${HOMEAGENTP_ADMIN_PASSWORD:?Set a strong admin password in .env}
      HOMEAGENTP_COOKIE_SECURE: ${HOMEAGENTP_COOKIE_SECURE:-false}
      HOMEAGENTP_SCRIPTS_DIR: /config/scripts
      HOMEAGENTP_REPORTS_DIR: /config/reports
      HOMEAGENTP_SEED_EXAMPLES: "false"
      HOMEAGENTP_NAS_ADAPTER_ENABLED: "false"
      HOMEAGENTP_NAS_SCHEDULER_ENABLED: "false"
      HOMEAGENTP_MEDIA_ADAPTER_ENABLED: "false"
      HOMEAGENTP_MEDIA_SCHEDULER_ENABLED: "false"
      HOMEAGENTP_HA_ENABLED: "false"
      HOMEAGENTP_HA_SCHEDULER_ENABLED: "false"
      HOMEAGENTP_TELEGRAM_ENABLED: "false"
      HOMEAGENTP_NOTIFICATION_SCHEDULER_ENABLED: "false"
    volumes:
      - homeagentp_core_data:/data:rw
      - ${HOMEAGENTP_REPO_DIR:-/home/tb3c/HomeAgentP}/config/examples/scripts:/config/scripts:ro
      - ${HOMEAGENTP_REPO_DIR:-/home/tb3c/HomeAgentP}/deploy/runtime/reports:/config/reports:ro
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    restart: unless-stopped
    networks:
      - homeagentp_internal

  homeagentp-web:
    image: homeagentp-web:local
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev
      - /var/run:size=8m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${HOMEAGENTP_BIND_IP:-127.0.0.1}:${HOMEAGENTP_PORT:-8310}:8310"
    depends_on:
      homeagentp-core:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    restart: unless-stopped
    networks:
      - homeagentp_internal

volumes:
  homeagentp_core_data:
    external: true
    name: homeagentp_homeagentp_core_data

networks:
  homeagentp_internal:
    driver: bridge

x-casaos:
  architectures:
    - amd64
  main: homeagentp-web
  author: Tb3c123
  developer: Tb3c123
  category: Utilities
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/heimdall.png
  title:
    en_us: HomeAgentP
  tagline:
    en_us: Home NAS Operations & Personal AI Workspace
  description:
    en_us: Two-container HomeAgentP platform (FastAPI Core + React/Nginx Web) for NAS operations, task boards, scripts, and workspace artifacts.
  port_map: "8310"
  scheme: http
  index: /
  web_ui:
    url: http://[IP]:[PORT:8310]
