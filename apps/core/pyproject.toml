[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homeagentp-core"
version = "0.1.0"
description = "HomeAgentP B+ Core service: auth, SQLite metadata, tasks, read-only script/report viewer, and NAS-safe operations foundation."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/homeagentp_core"]

[tool.pytest.ini_options]
testpaths = ["../../tests/core"]
pythonpath = ["src", "../.."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
